name: Godot weekly quality
on: [push, pull_request, workflow_dispatch]
jobs:
  week-05:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Bootstrap locked tools
        run: python3 tools/quality/bootstrap.py
      - name: Weekly regressions and failure-control proof
        run: python3 tools/quality/run_checks.py --week 5 --negative-control
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: week-05-test-evidence-${{ matrix.os }}
          path: reports/
